name: Rust checks and Windows package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: node --test
      - run: ./scripts/package.ps1
        shell: pwsh
      - run: ./scripts/smoke-package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: OracleBotControlPanel-windows-x64
          path: |
            dist/oracle-bot-panel.exe
            dist/OracleBotControlPanel-windows-x64.zip
          if-no-files-found: error
